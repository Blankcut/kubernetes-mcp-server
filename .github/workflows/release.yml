name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27'
  REGISTRY: docker.io
  IMAGE_NAME: blankcut/kubernetes-mcp-server
  # The Blank Cut cluster pulls from GAR, not Docker Hub: its image updater
  # watches this path and rolls the deployment when `latest` moves. A dedicated
  # repo, so this workflow can never write the platform's own images.
  GAR_IMAGE: us-east4-docker.pkg.dev/blankcut/kube-mcp-server/kubernetes-mcp-server
  DEPOT_PROJECT_ID: 18zh8qq988

jobs:
  build-and-push:
    name: Build and Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # GitHub OIDC token for the GCP Workload Identity Federation step
    outputs:
      gar: ${{ steps.gcp.outcome }} # success | failure | skipped; read by gar-publish-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GAR publishing is keyless (Workload Identity Federation) and switched on
      # by two repository variables. Until they are set -- or in a fork -- these
      # steps are skipped and the release publishes to Docker Hub only.
      #
      # continue-on-error: a GCP problem must not block the public Docker Hub
      # release. It is not silent either -- gar-publish-check fails the run.
      - name: Authenticate to Google Cloud
        id: gcp
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: ${{ steps.gcp.outcome == 'success' }}
        uses: docker/login-action@v4
        with:
          registry: us-east4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=${{ env.GAR_IMAGE }},enable=${{ steps.gcp.outcome == 'success' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Build and push Docker image
        uses: depot/build-push-action@v1
        with:
          token: ${{ secrets.DEPOT_TOKEN }}
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: ./kubernetes-claude-mcp
          file: ./kubernetes-claude-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # Separate from create-release so a GAR failure still lets the GitHub Release
  # be created, while the run itself goes red. The Blank Cut cluster pulls from
  # GAR only; an image that reached Docker Hub alone never gets deployed there.
  gar-publish-check:
    name: Verify GAR publish
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.gar == 'failure' }}
    steps:
      - name: Fail the run
        run: |
          echo "::error::Google Cloud authentication failed, so this image was published to Docker Hub only. The Blank Cut cluster pulls from GAR and will not update until it is published there. See the 'Authenticate to Google Cloud' step of the build job."
          exit 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        working-directory: kubernetes-claude-mcp
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mcp-server-linux-amd64 ./cmd/server/main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mcp-server-linux-arm64 ./cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o mcp-server-darwin-amd64 ./cmd/server/main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o mcp-server-darwin-arm64 ./cmd/server/main.go
          
          # Create checksums
          sha256sum mcp-server-* > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=See commit history for changes." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kubernetes-claude-mcp/mcp-server-*
            kubernetes-claude-mcp/checksums.txt
          body: |
            ## Docker Images
            
            Multi-architecture Docker images are available:
            
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            
            Supported architectures:
            - `linux/amd64`
            - `linux/arm64`
            
            ## Installation
            
            ### Using Docker
            ```bash
            docker run -d \
              -p 8080:8080 \
              -v $(pwd)/config.yaml:/app/config.yaml \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            
            ### Using Binary
            Download the appropriate binary for your platform and run:
            ```bash
            chmod +x mcp-server-<platform>-<arch>
            ./mcp-server-<platform>-<arch> --config config.yaml
            ```
            
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

