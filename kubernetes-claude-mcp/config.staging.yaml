server:
  address: ":8080"
  readTimeout: 30
  writeTimeout: 60
  auth:
    apiKey: "${API_KEY}"

kubernetes:
  kubeconfig: ""
  inCluster: true
  defaultContext: ""
  defaultNamespace: "staging"

argocd:
  url: "https://argocd-staging.example.com"
  authToken: "${ARGOCD_TOKEN}"
  insecure: false

gitlab:
  url: "https://gitlab.example.com"
  authToken: "${GITLAB_TOKEN}"
  apiVersion: "v4"
  projectPath: "staging/app"

claude:
  apiKey: "${CLAUDE_API_KEY}"
  baseURL: "https://api.anthropic.com"
  modelID: "claude-sonnet-5"
  # Sonnet 5 thinks by default, and thinking counts against this limit.
  maxTokens: 8192
  # No temperature: Sonnet 5 rejects a non-default value with a 400. The
  # client omits the field when it is unset.

