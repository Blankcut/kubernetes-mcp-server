server:
  address: ":8080"
  readTimeout: 30
  writeTimeout: 60
  auth:
    apiKey: "dev-api-key-change-me"

kubernetes:
  kubeconfig: ""
  inCluster: false
  defaultContext: ""
  defaultNamespace: "default"

argocd:
  url: "http://localhost:8080"
  authToken: "dev-argocd-token"
  insecure: true

gitlab:
  url: "https://gitlab.com"
  authToken: "dev-gitlab-token"
  apiVersion: "v4"
  projectPath: "dev/test-project"

claude:
  apiKey: "dev-claude-api-key"
  baseURL: "https://api.anthropic.com"
  modelID: "claude-sonnet-5"
  # Sonnet 5 thinks by default, and thinking counts against this limit.
  maxTokens: 8192
  # No temperature: Sonnet 5 rejects a non-default value with a 400. The
  # client omits the field when it is unset.

